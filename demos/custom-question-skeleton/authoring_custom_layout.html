<div class="lrn-qe-edit-form">
  <!-- Basic -->
  <span data-lrn-qe-label="stimulus"></span>
  <span
    data-lrn-qe-input="stimulus"
    data-placeholder="Go on, start editing..."
    class="lrn-qe-ckeditor-lg"
  ></span>

  <span data-lrn-qe-label="custom_question_click_correct_template"></span>
  <span data-lrn-qe-input="custom_question_click_correct_template"></span>

  <div class="lrn-qe-form-group"></div>

  <span
    data-lrn-qe-label="valid_response"
    data-lrn-qe-heading="4"
    data-lrn-qe-section="validation.heading"
    class="lrn-qe-h4 lrn-qe-section-header lrn-qe-text-bold lrn-qe-border-none"
  ></span>
  <div
    class="lrn-qe-tabs"
    data-lrn-qe-tabs
    data-lrn-qe-section="validation.content"

    <div class="lrn-qe-tab-item" data-lrn-qe-tab-item>
      <div class="lrn-qe-tab-sub-content">
        <span

        ></span>
        <span
          data-lrn-qe-label="score"
          class="lrn-qe-inline-block lrn-qe-margin-left-sm"
        ></span>
      </div>
      <span data-lrn-qe-input="valid_response"></span>
    </div>
  </div>

  <span data-lrn-qe-input="instant_feedback" class="lrn-qe-inline-block"></span>
  <span data-lrn-qe-label="instant_feedback" class="lrn-qe-inline-block"></span>
</div>
